version: '3.8'
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=office_booking
  
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=office_booking
      - DEBUG=False
      - CORS_ORIGINS=["http://localhost:5173"]
    env_file:
      - .env  # Load from .env file
    depends_on:
      - mongodb
    volumes:
      - ./app:/app

volumes:
  mongodb_data:




